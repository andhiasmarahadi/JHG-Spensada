<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGUAR - SMP Negeri 1 Dawan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- SheetJS for Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            user-select: none;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar-item-active {
            background-color: #eff6ff !important;
            color: #2563eb !important;
            box-shadow: none !important;
        }
        
        .sidebar-item-active .icon-container {
            background-color: #2563eb !important;
            color: white !important;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4);
        }

        .action-btn { transition: all 0.2s ease; }
        .action-btn:hover { transform: translateY(-2px); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .print-area { width: 100%; margin: 0; padding: 0; }
        }
        
        .modal-enter { animation: modalIn 0.3s ease-out; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .post-body { margin: 0 !important; padding: 0 !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- KONFIGURASI APLIKASI -->
    <script>
        const IS_PREVIEW = false; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx6cjQ-BnN7LZ1D8wxgSxHQz01wg3CcuxduD_wQXPzZtdmC4zW3GTMLNX8vfc66Ms2Ayw/exec"; 
        const APP_LOGO = "https://i.imghippo.com/files/RG1026Lg.png";
        const PRINT_KOP = "https://i.imghippo.com/files/tuTX6225pKs.png";
    </script>

    <!-- LOADING SPINNER -->
    <div id="loader" class="fixed inset-0 z-[100] flex items-center justify-center bg-white/80 backdrop-blur-sm hidden">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-600 shadow-lg"></div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app">
        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-700 via-blue-800 to-indigo-900">
            <div class="max-w-md w-full glass-morphism p-8 rounded-[2rem] shadow-2xl text-center relative z-10 border border-white/10">
                <img src="https://i.imghippo.com/files/RG1026Lg.png" alt="Logo Jaguar" class="mx-auto w-48 mb-8 drop-shadow-xl hover:scale-105 transition-transform duration-300">
                <div class="space-y-5">
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 group-focus-within:text-blue-500"><i class="fas fa-user"></i></span>
                        <input type="text" id="login-nip" placeholder="NIP / Username" class="w-full pl-12 pr-4 py-3.5 rounded-2xl border-2 border-gray-100 bg-gray-50 focus:bg-white focus:outline-none focus:border-blue-500 transition-all font-medium">
                    </div>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 group-focus-within:text-blue-500"><i class="fas fa-lock"></i></span>
                        <input type="password" id="login-pass" placeholder="Password" class="w-full pl-12 pr-4 py-3.5 rounded-2xl border-2 border-gray-100 bg-gray-50 focus:bg-white focus:outline-none focus:border-blue-500 transition-all font-medium">
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-4 rounded-2xl transition-all shadow-lg active:scale-[0.98]">MASUK KE SISTEM</button>
                    <p class="text-xs text-gray-400 font-medium mt-6">JAGUAR v2.0 &bull; SMP Negeri 1 Dawan<br><span class="text-gray-500 font-bold">Andhi Asmara Hadi &copy; 2026</span></p>
                </div>
            </div>
        </div>

        <!-- MAIN LAYOUT -->
        <div id="main-layout" class="hidden min-h-screen flex flex-col md:flex-row bg-[#f8fafc]">
            <aside id="sidebar" class="w-full md:w-[280px] bg-white shadow-sm md:min-h-screen no-print flex flex-col z-40 sticky top-0 md:relative">
                <div class="md:hidden flex items-center justify-between px-4 py-3 border-b border-gray-100">
                    <div class="flex items-center gap-3">
                        <img id="mobile-user-photo" src="https://via.placeholder.com/150" class="w-9 h-9 rounded-full object-cover">
                        <div class="flex flex-col">
                            <span id="mobile-user-name" class="font-bold text-gray-800 text-xs">User</span>
                            <span id="mobile-user-role" class="text-[9px] text-blue-600 font-bold uppercase">Role</span>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="text-red-500 p-2"><i class="fas fa-sign-out-alt"></i></button>
                </div>

                <div class="hidden md:flex p-6 md:p-8 flex-col items-center border-b border-gray-100 bg-gradient-to-b from-blue-50/50 to-white">
                    <img id="user-photo-sidebar" src="https://via.placeholder.com/150" class="w-24 h-24 rounded-full object-cover border-4 border-white mb-3 shadow-md">
                    <h3 id="user-name-sidebar" class="font-bold text-gray-800 text-center text-lg">Nama User</h3>
                    <span id="user-role-badge" class="px-4 py-1 bg-blue-100 text-blue-700 text-[10px] uppercase font-bold rounded-full mt-2 tracking-wider">Role</span>
                </div>
                
                <nav class="p-2 md:p-4 flex flex-row md:flex-col gap-2 overflow-x-auto md:overflow-visible md:flex-1" id="nav-menu"></nav>

                <div class="hidden md:block p-4 border-t border-gray-100 mt-auto">
                    <button onclick="handleLogout()" class="w-full flex items-center space-x-3 p-3.5 text-red-500 hover:bg-red-50 rounded-xl transition-all font-medium">
                        <i class="fas fa-sign-out-alt"></i><span>Logout</span>
                    </button>
                </div>
            </aside>

            <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full">
                <div id="content-container" class="max-w-7xl mx-auto"></div>
            </main>
        </div>
    </div>

    <script>
        let currentUser = null;
        let journalsData = [];
        let usersData = [];
        let activePage = 'dashboard';
        let currentFilteredJournals = []; 
        let editingJournalData = null;

        const dummyUsers = [
            { nip: 'admin', nama: 'Admin Jaguar', password: 'edudigital', role: 'Admin', foto: '', mapel: '-' },
            { nip: 'kepsek', nama: 'Kepala Sekolah, M.Pd', password: 'edudigital', role: 'Kepsek', foto: '', mapel: '-' },
            { nip: 'peserta', nama: 'Guru Aktif, S.Pd', password: 'edudigital', role: 'Guru', foto: '', mapel: 'Matematika' }
        ];

        const dummyJournals = [
            { id: '1001', tanggal: '2026-05-06', nip_user: 'peserta', nama_user: 'Guru Aktif, S.Pd', jam_mulai: '1', jam_selesai: '3', kelas: '7A', uraian: 'Mempelajari Aljabar Dasar', jml_hadir: 30, abs_sakit: 1, abs_ijin: 0, abs_alpha: 0, foto: '' },
        ];

        if(IS_PREVIEW) {
            usersData = [...dummyUsers];
            journalsData = [...dummyJournals];
        }

        const getAvatar = (nama, foto) => {
            if (foto && foto.startsWith('data:image')) return foto;
            if (foto && foto.trim() !== '' && !foto.includes('via.placeholder.com')) return foto.trim();
            return `https://ui-avatars.com/api/?name=${encodeURIComponent(nama || 'User')}&background=eff6ff&color=2563eb&bold=true&rounded=true`;
        };

        const showLoader = (show) => {
            const l = document.getElementById('loader');
            show ? l.classList.remove('hidden') : l.classList.add('hidden');
        };

        const notify = (title, icon = 'success') => {
            Swal.fire({ title: title, icon: icon, toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
        };

        const getTodayString = () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        async function callBackend(action, data) {
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: action, data: data }),
                    redirect: 'follow'
                });
                return await response.json();
            } catch (error) {
                return { status: 'error', message: 'Gagal terhubung ke server.' };
            }
        }

        function handleLogin() {
            const nip = document.getElementById('login-nip').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if(!nip || !pass) return notify('Isi NIP dan Password!', 'warning');
            showLoader(true);
            if (IS_PREVIEW) {
                setTimeout(() => {
                    const user = usersData.find(u => String(u.nip) === String(nip) && String(u.password) === String(pass));
                    if (user) { currentUser = user; initApp(); notify('Halo, ' + user.nama); }
                    else notify('NIP/Password salah!', 'error');
                    showLoader(false);
                }, 1000);
            } else {
                callBackend('login', { nip: nip, password: pass }).then(res => {
                    showLoader(false);
                    if(res.status === 'success') {
                        currentUser = res.user;
                        journalsData = res.journals;
                        usersData = res.users;
                        initApp();
                    } else notify(res.message, 'error');
                });
            }
        }

        function handleLogout() {
            Swal.fire({ title: 'Keluar?', text: "Sesi akan berakhir.", icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Logout' }).then((result) => {
                if (result.isConfirmed) {
                    currentUser = null;
                    document.getElementById('login-screen').classList.remove('hidden');
                    document.getElementById('main-layout').classList.add('hidden');
                }
            });
        }

        function initApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-layout').classList.remove('hidden');
            document.getElementById('user-photo-sidebar').src = getAvatar(currentUser.nama, currentUser.foto);
            document.getElementById('user-name-sidebar').innerText = currentUser.nama;
            document.getElementById('user-role-badge').innerText = currentUser.role;
            renderMenu();
            renderPage('dashboard');
        }

        function renderMenu() {
            const menuEl = document.getElementById('nav-menu');
            let menus = [ { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie', action: "renderPage('dashboard')" } ];
            if (currentUser.role === 'Admin') menus.push({ id: 'manage-users', label: 'Anggota', icon: 'fa-users-cog', action: "renderPage('manage-users')" });
            if (currentUser.role === 'Guru' || currentUser.role === 'Kepsek') {
                const lbl = currentUser.role === 'Kepsek' ? 'Isi Jurnal' : 'Jurnal Baru';
                menus.push({ id: 'input-jurnal', label: lbl, icon: 'fa-pen-to-square', action: "editingJournalData=null; renderPage('input-jurnal')" });
            }
            menus.push({ id: 'profile', label: 'Profil', icon: 'fa-user-shield', action: "renderPage('profile')" });
            menuEl.innerHTML = menus.map(m => `
                <button onclick="${m.action}" id="btn-${m.id}" class="flex-1 md:w-full flex items-center justify-center md:justify-start space-x-0 md:space-x-3 p-2 md:p-3.5 text-gray-500 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-all nav-btn font-medium">
                    <div class="w-10 h-10 md:w-8 md:h-8 rounded-xl flex items-center justify-center icon-container"><i class="fas ${m.icon} text-xl md:text-sm"></i></div>
                    <span class="hidden md:block text-sm">${m.label}</span>
                </button>
            `).join('');
        }

        function renderPage(page) {
            activePage = page;
            const container = document.getElementById('content-container');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('sidebar-item-active'));
            const activeBtn = document.getElementById('btn-' + page);
            if(activeBtn) activeBtn.classList.add('sidebar-item-active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (page === 'dashboard') renderDashboard(container);
            else if (page === 'input-jurnal') renderInputJurnal(container);
            else if (page === 'manage-users') renderManageUsers(container);
            else if (page === 'profile') renderProfile(container);
        }

        // --- DASHBOARD ---
        function renderDashboard(container, filteredData = null, filterState = {}) {
            let dataToShow = filteredData || (currentUser.role === 'Guru' ? journalsData.filter(j => j.nip_user === currentUser.nip) : journalsData);
            currentFilteredJournals = dataToShow; 
            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800">Dashboard</h1>
                    <div class="flex gap-2">
                        <button onclick="handlePrintDialog()" class="bg-white border border-indigo-200 text-indigo-600 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2"><i class="fas fa-print"></i> Cetak</button>
                        <button onclick="exportToExcel()" class="bg-white border border-emerald-200 text-emerald-600 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2"><i class="fas fa-file-excel"></i> Excel</button>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm mb-6 border border-gray-100">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                        <input type="date" id="filter-start" value="${filterState.start || ''}" class="w-full p-2.5 border rounded-xl text-sm">
                        <input type="date" id="filter-end" value="${filterState.end || ''}" class="w-full p-2.5 border rounded-xl text-sm">
                        ${currentUser.role !== 'Guru' ? `<input type="text" id="filter-name" value="${filterState.name || ''}" placeholder="Nama Guru..." class="w-full p-2.5 border rounded-xl text-sm">` : ''}
                        <button onclick="applyFilters()" class="bg-blue-600 text-white py-2.5 rounded-xl font-semibold text-sm">Filter</button>
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse whitespace-nowrap min-w-[800px]">
                            <thead class="bg-gray-50 text-gray-500 text-[11px] uppercase">
                                <tr>
                                    <th class="p-4 border-b">Waktu</th><th class="p-4 border-b">Guru</th><th class="p-4 border-b">Materi</th><th class="p-4 border-b text-center">Kelas</th><th class="p-4 border-b text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-50">${renderJournalRows(dataToShow)}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderJournalRows(data) {
            const sorted = [...data].sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
            if(sorted.length === 0) return `<tr><td colspan="5" class="p-8 text-center text-gray-400">Tidak ada data.</td></tr>`;
            return sorted.map(j => `
                <tr class="hover:bg-blue-50/40 transition-colors">
                    <td class="p-4 text-sm"><b>${j.tanggal}</b><br><span class="text-[10px] text-blue-600">Jam ${j.jam_mulai}-${j.jam_selesai}</span></td>
                    <td class="p-4 text-sm font-semibold">${j.nama_user}</td>
                    <td class="p-4 text-sm"><p class="max-w-[250px] truncate">${j.uraian}</p></td>
                    <td class="p-4 text-center"><span class="px-2 py-1 bg-gray-100 rounded-md text-[10px] font-bold">${j.kelas}</span></td>
                    <td class="p-4 text-center">
                        ${(currentUser.role === 'Admin' || currentUser.nip === j.nip_user) ? `
                        <button onclick="editJournalEntry('${j.id}')" class="text-blue-600 p-2"><i class="fas fa-pen"></i></button>
                        <button onclick="deleteIndividualJournal('${j.id}')" class="text-red-500 p-2"><i class="fas fa-trash"></i></button>` : '-'}
                    </td>
                </tr>
            `).join('');
        }

        function applyFilters() {
            const start = document.getElementById('filter-start').value;
            const end = document.getElementById('filter-end').value;
            const name = document.getElementById('filter-name')?.value.toLowerCase() || '';
            let filtered = journalsData;
            if(currentUser.role === 'Guru') filtered = filtered.filter(j => j.nip_user === currentUser.nip);
            if(start) filtered = filtered.filter(j => j.tanggal >= start);
            if(end) filtered = filtered.filter(j => j.tanggal <= end);
            if(name) filtered = filtered.filter(j => j.nama_user.toLowerCase().includes(name));
            renderDashboard(document.getElementById('content-container'), filtered, {start, end, name});
        }

        // --- INPUT / EDIT ---
        function renderInputJurnal(container) {
            const isGuru = currentUser.role === 'Guru';
            container.innerHTML = `
                <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold text-gray-800 mb-6">${editingJournalData ? 'Edit Jurnal' : 'Isi Jurnal'}</h2>
                    <form id="journal-form" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div><label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Tanggal</label>
                            <input type="date" id="f-tgl" required class="w-full p-3 border rounded-xl text-sm"></div>
                            <div><label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Kelas</label>
                            <select id="f-kelas" required class="w-full p-3 border rounded-xl text-sm">
                                <option value="Umum">Umum</option><option value="Istirahat">Istirahat</option>
                                ${[...Array(7)].map((_,i)=>`<option value="7${String.fromCharCode(65+i)}">7${String.fromCharCode(65+i)}</option>`).join('')}
                            </select></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div><label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Mulai</label>
                            <input type="number" id="f-jam-mulai" class="w-full p-3 border rounded-xl text-sm"></div>
                            <div><label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Selesai</label>
                            <input type="number" id="f-jam-selesai" class="w-full p-3 border rounded-xl text-sm"></div>
                        </div>
                        <div><label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Uraian</label>
                        <textarea id="f-uraian" rows="4" required class="w-full p-3 border rounded-xl text-sm"></textarea></div>
                        <img id="f-foto-img" class="h-32 hidden">
                        <button type="button" onclick="submitJurnal()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg">SIMPAN JURNAL</button>
                    </form>
                </div>
            `;
            
            // LOGIKA DEFAULT DATE & EDIT DATE
            if(editingJournalData) {
                document.getElementById('f-tgl').value = editingJournalData.tanggal;
                document.getElementById('f-kelas').value = editingJournalData.kelas;
                document.getElementById('f-jam-mulai').value = editingJournalData.jam_mulai;
                document.getElementById('f-jam-selesai').value = editingJournalData.jam_selesai;
                document.getElementById('f-uraian').value = editingJournalData.uraian;
            } else {
                document.getElementById('f-tgl').value = getTodayString();
            }
        }

        async function submitJurnal() {
            const form = document.getElementById('journal-form');
            if(!form.checkValidity()) return notify('Lengkapi data!', 'warning');
            showLoader(true);
            const data = {
                id: editingJournalData ? editingJournalData.id : Date.now().toString(),
                tanggal: document.getElementById('f-tgl').value,
                kelas: document.getElementById('f-kelas').value,
                jam_mulai: document.getElementById('f-jam-mulai').value,
                jam_selesai: document.getElementById('f-jam-selesai').value,
                uraian: document.getElementById('f-uraian').value,
                nip_user: editingJournalData ? editingJournalData.nip_user : currentUser.nip,
                nama_user: editingJournalData ? editingJournalData.nama_user : currentUser.nama,
                foto: document.getElementById('f-foto-img')?.src || ''
            };
            const action = editingJournalData ? 'updateJournal' : 'saveJournal';
            if(IS_PREVIEW) {
                setTimeout(() => {
                    if(editingJournalData) {
                        const idx = journalsData.findIndex(j => String(j.id) === String(data.id));
                        journalsData[idx] = data;
                    } else journalsData.unshift(data);
                    showLoader(false); editingJournalData = null; renderPage('dashboard'); notify('Berhasil!');
                }, 1000);
            } else {
                callBackend(action, { jurnalData: data }).then(res => {
                    showLoader(false);
                    if(res.status === 'success') { journalsData = res.journals; editingJournalData = null; renderPage('dashboard'); }
                    else notify(res.message, 'error');
                });
            }
        }

        function editJournalEntry(id) {
            editingJournalData = journalsData.find(j => String(j.id) === String(id));
            if(editingJournalData) renderPage('input-jurnal');
        }

        // --- PRINTING ---
        async function handlePrintDialog() {
            const isAdminOrKepsek = currentUser.role === 'Admin' || currentUser.role === 'Kepsek';
            let guruOptions = "";
            if (isAdminOrKepsek && usersData && usersData.length > 0) {
                guruOptions = usersData
                    .filter(u => u.role === 'Guru' || u.role === 'Kepsek')
                    .map(u => `<option value="${u.nip}">${u.nama}</option>`)
                    .join('');
            }
            const { value: filterValues } = await Swal.fire({
                title: 'Filter Laporan',
                html: `
                    <div class="text-left space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="date" id="p-start" class="swal2-input m-0 w-full" placeholder="Mulai">
                            <input type="date" id="p-end" class="swal2-input m-0 w-full" placeholder="Sampai">
                        </div>
                        ${isAdminOrKepsek ? `
                        <select id="p-guru" class="swal2-input m-0 w-full">
                            <option value="">-- Semua Guru --</option>
                            ${guruOptions}
                        </select>` : ''}
                    </div>
                `,
                preConfirm: () => ({
                    start: document.getElementById('p-start').value,
                    end: document.getElementById('p-end').value,
                    nip: isAdminOrKepsek ? document.getElementById('p-guru').value : currentUser.nip
                })
            });

            if(filterValues) {
                let filtered = journalsData;
                if(filterValues.nip) filtered = filtered.filter(j => j.nip_user === filterValues.nip);
                if(filterValues.start) filtered = filtered.filter(j => j.tanggal >= filterValues.start);
                if(filterValues.end) filtered = filtered.filter(j => j.tanggal <= filterValues.end);
                printReport(filtered, filterValues.nip);
            }
        }

        function printReport(data, filterNip) {
            if(!data.length) return notify('Data kosong!', 'warning');
            const target = usersData.find(u => u.nip === (filterNip || currentUser.nip)) || currentUser;
            const printWin = window.open('', '_blank');
            const rows = data.sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).map((j, i) => `
                <tr><td>${i+1}</td><td>${j.tanggal}</td><td>${j.jam_mulai}-${j.jam_selesai}</td><td>${j.kelas}</td><td>${j.uraian}</td></tr>
            `).join('');
            printWin.document.write(`
                <html><head><style>table{width:100%;border-collapse:collapse;}th,td{border:1px solid black;padding:5px;text-align:center;}</style></head>
                <body><h2 style="text-align:center;">JURNAL MENGAJAR</h2>
                <p>Nama: ${target.nama}<br>NIP: ${target.nip}</p>
                <table><thead><tr><th>No</th><th>Tanggal</th><th>Jam</th><th>Kelas</th><th>Materi</th></tr></thead><tbody>${rows}</tbody></table>
                <script>window.print();<\/script></body></html>
            `);
            printWin.document.close();
        }

        // --- MANAGE USERS ---
        function renderManageUsers(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold">Kelola Anggota</h1>
                    <button onclick="showUserForm()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">+ Tambah</button>
                </div>
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-[11px] uppercase"><tr><th class="p-4">Nama</th><th class="p-4">NIP</th><th class="p-4">Role</th></tr></thead>
                        <tbody class="divide-y">${usersData.map(u=>`<tr><td class="p-4 text-sm font-semibold">${u.nama}</td><td class="p-4 text-sm">${u.nip}</td><td class="p-4 text-sm">${u.role}</td></tr>`).join('')}</tbody>
                    </table>
                </div>
            `;
        }

        function renderProfile(container) {
            container.innerHTML = `<div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-sm border text-center">
                <img src="${getAvatar(currentUser.nama, currentUser.foto)}" class="w-24 h-24 rounded-full mx-auto mb-4 border">
                <h2 class="font-bold text-xl">${currentUser.nama}</h2><p class="text-gray-500 mb-6">${currentUser.role}</p>
                <div class="text-left space-y-4">
                    <input type="text" value="${currentUser.nip}" disabled class="w-full p-3 border rounded-xl bg-gray-50">
                    <input type="text" id="p-nama" value="${currentUser.nama}" class="w-full p-3 border rounded-xl">
                    <button onclick="updateProfile()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">SIMPAN</button>
                </div>
            </div>`;
        }
    </script>
</body>
</html>
