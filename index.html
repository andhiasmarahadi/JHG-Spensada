<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGUAR - SMP Negeri 1 Dawan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- SheetJS for Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            user-select: none;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar-item-active {
            background-color: #eff6ff !important;
            color: #2563eb !important;
            box-shadow: none !important;
        }
        
        .sidebar-item-active .icon-container {
            background-color: #2563eb !important;
            color: white !important;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4);
        }

        .action-btn { transition: all 0.2s ease; }
        .action-btn:hover { transform: translateY(-2px); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .print-area { width: 100%; margin: 0; padding: 0; }
        }
        
        .modal-enter { animation: modalIn 0.3s ease-out; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- KONFIGURASI APLIKASI -->
    <script>
        const IS_PREVIEW = false; // Pastikan ini FALSE untuk versi GitHub
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwd8-MLRxpidxWF0CFl_upWAy8do6IucOwFmxTO_p_NaX-4-uiR5KkQS33s49aq46DM/exec"; // Wajib diisi dengan URL Deploy GAS terbaru
        const APP_LOGO = "https://i.imghippo.com/files/RG1026Lg.png";
        const PRINT_KOP = "https://i.imghippo.com/files/tuTX6225pKs.png";
    </script>

    <!-- LOADING SPINNER -->
    <div id="loader" class="fixed inset-0 z-[100] flex items-center justify-center bg-white/80 backdrop-blur-sm hidden">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-600 shadow-lg"></div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app">
        <!-- APP ROUTES (LOGIN / DASHBOARD) -->
        <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-700 via-blue-800 to-indigo-900">
            <div class="absolute top-0 left-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
            <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
            
            <div class="max-w-md w-full glass-morphism p-8 rounded-[2rem] shadow-2xl text-center relative z-10 border border-white/10">
                <img src="https://i.imghippo.com/files/RG1026Lg.png" alt="Logo Jaguar" class="mx-auto w-48 mb-8 drop-shadow-xl hover:scale-105 transition-transform duration-300">
                <div class="space-y-5">
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 group-focus-within:text-blue-500 transition-colors">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" id="login-nip" placeholder="NIP / Username" class="w-full pl-12 pr-4 py-3.5 rounded-2xl border-2 border-gray-100 bg-gray-50 focus:bg-white focus:outline-none focus:border-blue-500 transition-all font-medium text-gray-700 placeholder-gray-400">
                    </div>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 group-focus-within:text-blue-500 transition-colors">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="login-pass" placeholder="Password" class="w-full pl-12 pr-4 py-3.5 rounded-2xl border-2 border-gray-100 bg-gray-50 focus:bg-white focus:outline-none focus:border-blue-500 transition-all font-medium text-gray-700 placeholder-gray-400">
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-2xl transition-all duration-300 shadow-lg shadow-blue-500/30 active:scale-[0.98]">
                        MASUK KE SISTEM
                    </button>
                    <!-- TRADEMARK UPDATE -->
                    <p class="text-xs text-gray-400 font-medium mt-6 tracking-wide leading-relaxed">
                        JAGUAR v2.0 &bull; SMP Negeri 1 Dawan<br>
                        <span class="text-gray-500 font-bold">Andhi Asmara hadi @ 2026</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- MAIN LAYOUT -->
        <div id="main-layout" class="hidden min-h-screen flex flex-col md:flex-row bg-[#f8fafc]">
            
            <!-- SIDEBAR & MOBILE NAVIGATION -->
            <aside id="sidebar" class="w-full md:w-[280px] bg-white shadow-sm md:shadow-[4px_0_24px_rgba(0,0,0,0.02)] md:min-h-screen no-print flex flex-col z-40 sticky top-0 md:relative">
                
                <!-- MOBILE HEADER (Only visible on mobile) -->
                <div class="md:hidden flex items-center justify-between px-4 py-3 border-b border-gray-100 bg-white">
                    <div class="flex items-center gap-3">
                        <img id="mobile-user-photo" src="https://via.placeholder.com/150" class="w-9 h-9 rounded-full object-cover border-2 border-white shadow-sm">
                        <div class="flex flex-col">
                            <span id="mobile-user-name" class="font-bold text-gray-800 text-xs">User</span>
                            <span id="mobile-user-role" class="text-[9px] text-blue-600 font-bold uppercase tracking-wider">Role</span>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="text-red-500 p-2 hover:bg-red-50 rounded-lg transition-colors">
                        <i class="fas fa-sign-out-alt text-lg"></i>
                    </button>
                </div>

                <!-- DESKTOP PROFILE (Hidden on mobile) -->
                <div class="hidden md:flex p-6 md:p-8 flex-col items-center border-b border-gray-100 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-r from-blue-50 to-indigo-50"></div>
                    <img id="user-photo-sidebar" src="https://via.placeholder.com/150" class="w-24 h-24 rounded-full object-cover border-4 border-white mb-3 shadow-md relative z-10">
                    <h3 id="user-name-sidebar" class="font-bold text-gray-800 text-center relative z-10 text-lg">Nama User</h3>
                    <span id="user-role-badge" class="px-4 py-1.5 bg-gradient-to-r from-blue-100 to-indigo-100 text-blue-700 text-[10px] uppercase font-bold rounded-full mt-2 relative z-10 shadow-sm border border-blue-200/50 tracking-wider">Role</span>
                </div>
                
                <!-- NAVIGATION MENU -->
                <nav class="p-2 md:p-4 flex flex-row md:flex-col gap-2 md:gap-1.5 overflow-x-auto md:overflow-visible bg-white border-b md:border-b-0 border-gray-100 md:flex-1 justify-between md:justify-start" id="nav-menu">
                    <!-- Nav items injected via JS based on role -->
                </nav>

                <!-- DESKTOP LOGOUT (Hidden on mobile) -->
                <div class="hidden md:block p-4 border-t border-gray-100 mt-auto bg-gray-50/50">
                    <button onclick="handleLogout()" class="w-full flex items-center justify-center md:justify-start space-x-3 p-3.5 text-red-500 hover:bg-red-50 hover:text-red-600 rounded-xl transition-all font-medium active:scale-[0.98]">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout dari JAGUAR</span>
                    </button>
                </div>
            </aside>

            <!-- CONTENT AREA -->
            <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full">
                <div id="content-container" class="max-w-7xl mx-auto"></div>
            </main>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // --- DATA STATE ---
        let currentUser = null;
        let journalsData = [];
        let usersData = [];
        let activePage = 'dashboard';
        let currentFilteredJournals = []; 

        const getAvatar = (nama, foto) => {
            if (foto && foto.trim() !== '') return foto;
            return `https://ui-avatars.com/api/?name=${encodeURIComponent(nama || 'User')}&background=eff6ff&color=2563eb&bold=true&rounded=true`;
        };

        const dummyUsers = [
            { nip: 'admin', nama: 'Admin Jaguar', password: 'edudigital', role: 'Admin', foto: '', mapel: '-' },
            { nip: 'kepsek', nama: 'Kepala Sekolah, M.Pd', password: 'edudigital', role: 'Kepsek', foto: '', mapel: '-' },
            { nip: 'guru', nama: 'Guru Aktif, S.Pd', password: 'edudigital', role: 'Guru', foto: '', mapel: 'Matematika' }
        ];

        const dummyJournals = [];

        if(IS_PREVIEW) {
            usersData = [...dummyUsers];
            journalsData = [...dummyJournals];
        }

        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        };

        const showLoader = (show) => {
            const l = document.getElementById('loader');
            show ? l.classList.remove('hidden') : l.classList.add('hidden');
        };

        const notify = (title, icon = 'success') => {
            Swal.fire({
                title: title, icon: icon, toast: true, position: 'top-end', showConfirmButton: false, timer: 3000
            });
        };

        const compressImage = async (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 700; 
                        if (width > height) {
                            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
                        } else {
                            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                    };
                };
            });
        };

        // --- API CALL HANDLER UNTUK GITHUB PAGES ---
        async function callBackend(action, data) {
            try {
                if(!GAS_URL || GAS_URL === "") {
                    return { status: 'error', message: 'GAS_URL belum diatur. Silakan isi konfigurasi GAS_URL di index.html' };
                }
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: action, data: data }),
                    redirect: 'follow'
                });
                return await response.json();
            } catch (error) {
                return { status: 'error', message: 'Gagal terhubung ke server. Detail: ' + error.message };
            }
        }

        // --- CORE LOGIC ---
        function handleLogin() {
            const nip = document.getElementById('login-nip').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            if(!nip || !pass) return notify('Mohon isi NIP dan Password!', 'warning');

            showLoader(true);

            if (IS_PREVIEW) {
                setTimeout(() => {
                    const user = usersData.find(u => String(u.nip) === String(nip) && String(u.password) === String(pass));
                    if (user) {
                        currentUser = user;
                        initApp();
                        notify('Selamat datang, ' + user.nama);
                    } else {
                        notify('NIP atau Password salah!', 'error');
                    }
                    showLoader(false);
                }, 1000);
            } else {
                callBackend('login', { nip: nip, password: pass }).then(res => {
                    showLoader(false);
                    if(res.status === 'success') {
                        currentUser = res.user;
                        journalsData = res.journals;
                        usersData = res.users;
                        initApp();
                        notify('Selamat datang, ' + currentUser.nama);
                    } else {
                        notify(res.message, 'error');
                    }
                });
            }
        }

        function handleLogout() {
            Swal.fire({
                title: 'Keluar dari Sistem?',
                text: "Sesi Anda akan diakhiri.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Ya, Logout',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    currentUser = null;
                    document.getElementById('login-screen').classList.remove('hidden');
                    document.getElementById('main-layout').classList.add('hidden');
                    document.getElementById('login-nip').value = '';
                    document.getElementById('login-pass').value = '';
                }
            });
        }

        function initApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-layout').classList.remove('hidden');
            
            // Desktop Profile
            document.getElementById('user-photo-sidebar').src = getAvatar(currentUser.nama, currentUser.foto);
            document.getElementById('user-name-sidebar').innerText = currentUser.nama;
            document.getElementById('user-role-badge').innerText = currentUser.role;

            // Mobile Profile
            const mobilePhoto = document.getElementById('mobile-user-photo');
            if(mobilePhoto) mobilePhoto.src = getAvatar(currentUser.nama, currentUser.foto);
            const mobileName = document.getElementById('mobile-user-name');
            if(mobileName) mobileName.innerText = currentUser.nama;
            const mobileRole = document.getElementById('mobile-user-role');
            if(mobileRole) mobileRole.innerText = currentUser.role;

            renderMenu();
            renderPage('dashboard');
        }

        function renderMenu() {
            const menuEl = document.getElementById('nav-menu');
            let menus = [ { id: 'dashboard', label: 'Dashboard Utama', icon: 'fa-chart-pie' } ];

            if (currentUser.role === 'Admin') {
                menus.push({ id: 'manage-users', label: 'Kelola Anggota', icon: 'fa-users-cog' });
            }
            if (currentUser.role === 'Guru' || currentUser.role === 'Kepsek') {
                const labelInput = currentUser.role === 'Kepsek' ? 'Isi Jurnal Kepsek' : 'Isi Jurnal Baru';
                menus.push({ id: 'input-jurnal', label: labelInput, icon: 'fa-pen-to-square' });
            }
            menus.push({ id: 'profile', label: 'Pengaturan Profil', icon: 'fa-user-shield' });

            // Layout navigasi responsif (Icon-only untuk mobile)
            menuEl.innerHTML = menus.map(m => `
                <button onclick="renderPage('${m.id}')" id="btn-${m.id}" title="${m.label}" class="flex-1 md:w-full flex items-center justify-center md:justify-start space-x-0 md:space-x-3 p-2 md:p-3.5 text-gray-500 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-all duration-300 nav-btn font-medium active:scale-[0.98]">
                    <div class="w-10 h-10 md:w-8 md:h-8 rounded-xl md:rounded-lg flex items-center justify-center bg-transparent md:bg-gray-100 text-current md:text-gray-500 icon-container transition-colors">
                        <i class="fas ${m.icon} text-xl md:text-sm"></i>
                    </div>
                    <span class="hidden md:block text-sm tracking-wide">${m.label}</span>
                </button>
            `).join('');
        }

        function renderPage(page) {
            activePage = page;
            const container = document.getElementById('content-container');
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('sidebar-item-active'));
            const activeBtn = document.getElementById('btn-' + page);
            if(activeBtn) activeBtn.classList.add('sidebar-item-active');

            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (page === 'dashboard') renderDashboard(container);
            else if (page === 'input-jurnal') renderInputJurnal(container);
            else if (page === 'manage-users') renderManageUsers(container);
            else if (page === 'profile') renderProfile(container);
        }

        // --- DASHBOARD RENDERER ---
        function renderDashboard(container) {
            let dataToShow = journalsData;
            
            if(currentUser.role === 'Guru') {
                dataToShow = journalsData.filter(j => j.nip_user === currentUser.nip);
            }

            currentFilteredJournals = dataToShow; 

            container.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Dashboard Jurnal</h1>
                        <p class="text-sm text-gray-500 mt-1">Pantau dan kelola aktivitas jurnal harian</p>
                    </div>
                    <div class="flex flex-wrap gap-2 w-full md:w-auto">
                        <button onclick="handlePrintDialog()" class="flex-1 md:flex-none action-btn bg-white border border-indigo-200 text-indigo-600 px-4 py-2.5 rounded-xl hover:bg-indigo-50 text-sm font-semibold flex items-center justify-center gap-2 shadow-sm">
                            <i class="fas fa-print"></i> Cetak Laporan
                        </button>
                        ${currentUser.role === 'Admin' ? `
                            <button onclick="handleBulkDelete()" class="flex-1 md:flex-none action-btn bg-white border border-red-200 text-red-600 px-4 py-2.5 rounded-xl hover:bg-red-50 text-sm font-semibold flex items-center justify-center gap-2 shadow-sm">
                                <i class="fas fa-trash-alt"></i> Hapus Data
                            </button>
                        ` : ''}
                    </div>
                </div>

                <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm mb-6 border border-gray-100 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>
                    <div class="flex items-center gap-2 mb-4">
                        <i class="fas fa-filter text-blue-500 bg-blue-50 p-2 rounded-lg text-sm"></i>
                        <h3 class="font-bold text-gray-700 text-sm">Filter Pencarian</h3>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 ${currentUser.role === 'Guru' ? 'lg:grid-cols-3' : 'lg:grid-cols-4'} gap-4 items-end">
                        <div>
                            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">Dari Tanggal</label>
                            <input type="date" id="filter-start" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all bg-gray-50 focus:bg-white text-gray-700">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">Sampai Tanggal</label>
                            <input type="date" id="filter-end" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all bg-gray-50 focus:bg-white text-gray-700">
                        </div>
                        ${currentUser.role !== 'Guru' ? `
                        <div>
                            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">Nama Guru</label>
                            <div class="relative group">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 group-focus-within:text-blue-500 transition-colors"><i class="fas fa-search"></i></span>
                                <input type="text" id="filter-name" placeholder="Ketik nama..." class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all bg-gray-50 focus:bg-white text-gray-700 placeholder-gray-400">
                            </div>
                        </div>
                        ` : ''}
                        <div class="flex gap-2">
                            <button onclick="applyFilters()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl hover:bg-blue-700 transition font-semibold shadow-md shadow-blue-600/20 active:scale-95 flex items-center justify-center gap-2 text-sm">Terapkan</button>
                            <button onclick="resetFilters()" class="flex-1 bg-white text-gray-600 py-2.5 rounded-xl hover:bg-gray-50 transition font-semibold active:scale-95 border border-gray-200 flex items-center justify-center gap-2 text-sm">Reset</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse whitespace-nowrap min-w-[800px]">
                            <thead>
                                <tr class="bg-gray-50/80 text-gray-500 text-[11px] uppercase tracking-wider">
                                    <th class="p-4 border-b font-semibold w-32">Waktu</th>
                                    <th class="p-4 border-b font-semibold">Guru Pengajar</th>
                                    <th class="p-4 border-b font-semibold">Kegiatan / Materi</th>
                                    <th class="p-4 border-b font-semibold text-center w-24">Kelas</th>
                                    <th class="p-4 border-b font-semibold text-center w-24">Dok.</th>
                                    <th class="p-4 border-b font-semibold text-center w-20">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="journal-list-body" class="divide-y divide-gray-50">
                                ${renderJournalRows(dataToShow)}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderJournalRows(data) {
            const sorted = [...data].sort((a, b) => {
                const dateA = new Date(a.tanggal);
                const dateB = new Date(b.tanggal);
                if (dateA > dateB) return -1;
                if (dateA < dateB) return 1;
                return (parseInt(b.jam_mulai) || 0) - (parseInt(a.jam_mulai) || 0);
            });
            if(sorted.length === 0) return `<tr><td colspan="6" class="p-12 text-center text-gray-400 font-medium"><i class="fas fa-folder-open text-3xl mb-3 block text-gray-300"></i>Belum ada data jurnal ditemukan.</td></tr>`;
            
            return sorted.map(j => `
                <tr class="hover:bg-blue-50/40 transition-colors group">
                    <td class="p-4 align-top">
                        <div class="font-bold text-gray-800 text-sm">${formatDate(j.tanggal)}</div>
                        <div class="text-[11px] text-blue-600 bg-blue-50 inline-flex items-center px-2 py-0.5 rounded-md mt-1.5 font-bold border border-blue-100">
                            <i class="far fa-clock mr-1"></i> Jam: ${j.jam_mulai}-${j.jam_selesai}
                        </div>
                    </td>
                    <td class="p-4 align-top font-semibold text-gray-700">
                        <div class="flex items-center gap-3">
                            <img src="${getAvatar(j.nama_user, usersData.find(u => u.nip === j.nip_user)?.foto)}" class="w-9 h-9 rounded-full border-2 border-white shadow-sm object-cover">
                            <div>
                                <span class="block text-sm">${j.nama_user}</span>
                                <span class="block text-[10px] text-gray-400 font-normal font-mono mt-0.5">${j.nip_user}</span>
                            </div>
                        </div>
                    </td>
                    <td class="p-4 align-top">

        function handleKelasChange() {
            const kelas = document.getElementById('f-kelas')?.value;
            const containerKehadiran = document.getElementById('container-kehadiran');
            const containerFoto = document.getElementById('container-foto');
            const fUraian = document.getElementById('f-uraian');
            
            if (kelas === 'Istirahat') {
                if (containerKehadiran) containerKehadiran.classList.add('hidden');
                if (containerFoto) containerFoto.classList.add('hidden');
                if (fUraian && fUraian.value.trim() === '') fUraian.value = 'Waktu Istirahat';
            } else if (kelas === 'Umum') {
                if (containerKehadiran) containerKehadiran.classList.add('hidden');
                if (containerFoto) containerFoto.classList.remove('hidden');
            } else {
                if (containerKehadiran) containerKehadiran.classList.remove('hidden');
                if (containerFoto) containerFoto.classList.remove('hidden');
            }
        }

        async function previewSelectedFoto(input) {
            if (input.files && input.files[0]) {
                const container = document.getElementById('foto-preview-container');
                const img = document.getElementById('f-foto-img');
                const base64 = await compressImage(input.files[0]);
                img.src = base64;
                container.classList.remove('hidden');
            }
        }

        async function submitJurnal() {
            const form = document.getElementById('journal-form');
            if(!form.checkValidity()) return notify('Lengkapi semua field yang wajib diisi!', 'warning');

            showLoader(true);
            const data = {
                id: Date.now().toString(),
                tanggal: document.getElementById('f-tgl').value,
                kelas: document.getElementById('f-kelas').value,
                jam_mulai: document.getElementById('f-jam-mulai').value,
                jam_selesai: document.getElementById('f-jam-selesai').value,
                uraian: document.getElementById('f-uraian').value,
                nip_user: currentUser.nip,
                nama_user: currentUser.nama,
                foto: document.getElementById('f-foto-img')?.src || ''
            };

            if(currentUser.role === 'Guru' && data.kelas !== 'Istirahat' && data.kelas !== 'Umum') {
                data.jml_hadir = document.getElementById('f-hadir').value;
                data.abs_sakit = document.getElementById('f-sakit').value;
                data.abs_ijin = document.getElementById('f-ijin').value;
                data.abs_alpha = document.getElementById('f-alpha').value;
            } else {
                data.jml_hadir = 0; data.abs_sakit = 0; data.abs_ijin = 0; data.abs_alpha = 0;
            }

            if(IS_PREVIEW) {
                setTimeout(() => {
                    journalsData.unshift(data);
                    showLoader(false);
                    notify('Jurnal berhasil disimpan!');
                    resetFormInputJurnal();
                }, 1000);
            } else {
                callBackend('saveJournal', { jurnalData: data }).then(res => {
                    showLoader(false);
                    if(res.status === 'success') {
                        journalsData = res.journals;
                        notify('Jurnal berhasil disimpan!');
                        resetFormInputJurnal();
                    } else {
                        notify(res.message, 'error');
                    }
                });
            }
        }

        function resetFormInputJurnal() {
            document.getElementById('journal-form').reset();

            if(document.getElementById('f-foto-img')) document.getElementById('f-foto-img').src = '';
            if(document.getElementById('foto-preview-container')) document.getElementById('foto-preview-container').classList.add('hidden');
            handleKelasChange();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

                    filtered = filtered.filter(j => j.nip_user === currentUser.nip);
                }

        function printReport(dataToPrint) {
            if (!dataToPrint || dataToPrint.length === 0) return notify('Tidak ada data untuk dicetak pada filter tersebut', 'warning');

            const kepsek = usersData.find(u => u.role === 'Kepsek') || { nama: '................', nip: '................' };
            
            let guruInfoNama = currentUser.nama;
            let guruInfoNip = currentUser.nip;
            let isKepsekFormat = false;
            
            if (currentUser.role === 'Kepsek') {
                isKepsekFormat = true;
            } else if (currentUser.role === 'Admin') {
                const uniqueGurus = [...new Set(dataToPrint.map(j => j.nip_user))];
                if (uniqueGurus.length === 1) {
                    guruInfoNama = dataToPrint[0].nama_user;
                    guruInfoNip = dataToPrint[0].nip_user;
                    const targetUser = usersData.find(u => u.nip === uniqueGurus[0]);
                    if (targetUser && targetUser.role === 'Kepsek') {
                        isKepsekFormat = true;
                    }
                } else {
                    guruInfoNama = "Semua Guru (Silakan filter guru tertentu terlebih dahulu)";
                    guruInfoNip = "-";
                }
            }

            const printWin = window.open('', '_blank');
            
            const sortedData = [...dataToPrint].sort((a, b) => {
                const dateA = new Date(a.tanggal);
                const dateB = new Date(b.tanggal);
                if (dateA < dateB) return -1;
                if (dateA > dateB) return 1;
                
                const jamA = parseInt(a.jam_mulai) || 0;
                const jamB = parseInt(b.jam_mulai) || 0;
                return jamA - jamB;
            });

            let tableHeader = isKepsekFormat ? `
                <tr>
                    <th style="width: 5%;">No</th>
                    <th style="width: 18%;">Hari/Tanggal</th>
                    <th style="width: 8%;">Jam Ke</th>
                    <th>Uraian Kegiatan</th>
                    <th style="width: 25%;">Dokumentasi</th>
                </tr>
            ` : `
                <tr>
                    <th rowspan="2" style="width: 4%;">No</th>
                    <th rowspan="2" style="width: 13%;">Hari /<br>Tanggal</th>
                    <th rowspan="2" style="width: 6%;">Jam Ke</th>
                    <th rowspan="2" style="width: 8%;">Kelas</th>
                    <th rowspan="2">Uraian Kegiatan / Pokok Bahasan</th>
                    <th colspan="4" style="width: 16%;">Kehadiran Siswa</th>
                    <th rowspan="2" style="width: 18%;">Dokumentasi</th>
                </tr>
                <tr>
                    <th style="background-color: #86efac; width: 4%;">H</th>
                    <th style="background-color: #fde047; width: 4%;">S</th>
                    <th style="background-color: #93c5fd; width: 4%;">I</th>
                    <th style="background-color: #fca5a5; width: 4%;">A</th>
                </tr>
            `;

            let tableRows = "";
            sortedData.forEach((j, index) => {
                const isIstirahat = j.kelas === 'Istirahat';
                const isUmum = j.kelas === 'Umum';
                
                const dayStr = new Date(j.tanggal).toLocaleDateString('id-ID', { weekday: 'long' });
                const dateStr = new Date(j.tanggal).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const dateDisplay = dayStr + ",<br>" + dateStr;
                
                let rowSpan = 1;
                let jamList = [j.jam_mulai];
                if (!isNaN(j.jam_mulai) && !isNaN(j.jam_selesai)) {
                    let start = parseInt(j.jam_mulai);
                    let end = parseInt(j.jam_selesai);
                    if (end >= start && !isIstirahat && !isUmum) {
                        rowSpan = end - start + 1;
                        jamList = [];
                        for(let k = start; k <= end; k++) jamList.push(k);
                    }
                }

                let rowHTML = "<tr>";
                rowHTML += "<td class='center' rowspan='" + rowSpan + "'>" + (index + 1) + "</td>";
                rowHTML += "<td class='center' rowspan='" + rowSpan + "'>" + dateDisplay + "</td>";

                if (isKepsekFormat) {
                    if (isIstirahat) {
                        rowHTML += "<td colspan='3' class='bg-istirahat' style='background-color: #e0f2fe !important;'>ISTIRAHAT</td></tr>";
                    } else {
                        rowHTML += "<td class='center'>" + jamList[0] + "</td>";
                        rowHTML += "<td rowspan='" + rowSpan + "'>" + j.uraian + "</td>";
                        rowHTML += "<td class='center' rowspan='" + rowSpan + "'>" + (j.foto ? "<img src='" + j.foto + "' class='doc'>" : "-") + "</td></tr>";
                        for (let k = 1; k < jamList.length; k++) {
                            rowHTML += "<tr><td class='center'>" + jamList[k] + "</td></tr>";
                        }
                    }
                } else {
                    if (isIstirahat) {
                        rowHTML += "<td colspan='8' class='bg-istirahat' style='background-color: #e0f2fe !important;'>ISTIRAHAT</td></tr>";
                    } else if (isUmum) {
                        rowHTML += "<td colspan='7' class='bg-istirahat' style='background-color: white !important; font-weight: normal; font-style: normal; text-align: left !important;'>" + j.uraian + "</td>";
                        rowHTML += "<td class='center' style='vertical-align: middle;'>" + (j.foto ? "<img src='" + j.foto + "' class='doc'>" : "-") + "</td></tr>";
                    } else {
                        rowHTML += "<td class='center'>" + jamList[0] + "</td>";
                        rowHTML += "<td class='center' rowspan='" + rowSpan + "'>" + j.kelas + "</td>";
                        rowHTML += "<td rowspan='" + rowSpan + "'>" + j.uraian + "</td>";
                        rowHTML += "<td class='center' rowspan='" + rowSpan + "'>" + j.jml_hadir + "</td>";
                        rowHTML += "<td class='center' rowspan='" + rowSpan + "'>" + j.abs_sakit + "</td>";
                        rowHTML += "<td class='center' rowspan='" + rowSpan + "'>" + j.abs_ijin + "</td>";
                        rowHTML += "<td class='center' rowspan='" + rowSpan + "'>" + j.abs_alpha + "</td>";
                        rowHTML += "<td class='center' rowspan='" + rowSpan + "'>" + (j.foto ? "<img src='" + j.foto + "' class='doc'>" : "-") + "</td></tr>";
                        
                        for (let k = 1; k < jamList.length; k++) {
                            rowHTML += "<tr><td class='center'>" + jamList[k] + "</td></tr>";
                        }
                    }
                }
                tableRows += rowHTML;
            });

            const htmlString = `
                <html>
                <head>
                    <title>Cetak Laporan Jurnal</title>
                    <style>
                        @page { size: A4 portrait; margin: 1cm; }
                        body { font-family: 'Times New Roman', serif; font-size: 10pt; line-height: 1.3; color: black; }
                        .kop { text-align: center; margin-bottom: 15px; width: 100%; }
                        .kop img { width: 100%; height: auto; display: block; object-fit: contain; }
                        h2 { text-align: center; text-transform: uppercase; margin: 10px 0 15px 0; font-size: 14pt; font-weight: bold;}
                        table.data { width: 100%; border-collapse: collapse; margin-top: 10px; }
                        table.data th, table.data td { border: 1px solid black; padding: 5px; text-align: left; vertical-align: middle; }
                        table.data th { text-align: center; font-weight: bold; background-color: #dae8f5; }
                        .bg-istirahat { text-align: center !important; vertical-align: middle !important; font-weight: bold; font-style: italic; }
                        .center { text-align: center; }
                        .footer { margin-top: 30px; width: 100%; page-break-inside: avoid; }
                        .footer table { border: none !important; width: 100%; }
                        .footer td { border: none !important; width: 50%; padding-top: 10px; text-align: center; }
                        img.doc { max-width: 100px; max-height: 100px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc; display: block; margin: 0 auto; }
                    </style>
                </head>
                <body>
                    <div class="kop"><img src="${PRINT_KOP}" alt="KOP SURAT DINAS"></div>
                    <h2>JURNAL KEGIATAN BELAJAR MENGAJAR</h2>
                    
                    <table style="width: 100%; margin-bottom: 15px; border: none;">
                        <tr><td style="width: 150px; border: none; padding: 3px 0;">Nama Guru</td><td style="width: 10px; border: none; padding: 3px 0;">:</td><td style="border: none; padding: 3px 0;">${guruInfoNama}</td></tr>
                        <tr><td style="border: none; padding: 3px 0;">NIP</td><td style="border: none; padding: 3px 0;">:</td><td style="border: none; padding: 3px 0;">${guruInfoNip}</td></tr>
                    </table>

                    <table class="data">
                        <thead>${tableHeader}</thead>
                        <tbody>${tableRows}</tbody>
                    </table>

                    <div class="footer">
                        <table>
                            <tr>
                                <td>Mengetahui,<br>Kepala SMP Negeri 1 Dawan<br><br><br><br><br><b><u>${kepsek.nama}</u></b><br>NIP. ${kepsek.nip}</td>
                                <td>Dawan, ${new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}<br>Guru Mata Pelajaran<br><br><br><br><br><b><u>${guruInfoNama}</u></b><br>NIP. ${guruInfoNip}</td>
                            </tr>
                        </table>
                    </div>
                    <script>setTimeout(() => window.print(), 500);<\/script>
                </body>
                </html>
            `;
            printWin.document.write(htmlString);
            printWin.document.close();
        }

                    confirmButtonColor: '#d33'
                });

                    renderPage('dashboard');

                    title: 'Hapus Data Guru',

        function downloadUserTemplate() {
            const data = [
                ['NIP', 'Nama', 'Password', 'Mapel', 'Role (Admin/Kepsek/Guru)', 'Foto (URL/Base64)']
            ];
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Template");
            XLSX.writeFile(wb, "Template_User_Jaguar.xlsx");
        }

        function handleExcelUpload(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet);
                
                const newUsers = rows.map(r => ({
                    nip: String(r.NIP || r.nip || '').trim(),
                    nama: String(r.Nama || r.nama || '').trim(),
                    password: String(r.Password || r.password || '123456').trim(),
                    mapel: String(r.Mapel || r.mapel || '-').trim(),
                    role: String(r.Role || r.role || 'Guru').trim(),
                    foto: String(r.Foto || r.foto || '').trim()
                })).filter(u => u.nip && u.nama);

                if(newUsers.length > 0) {
                    showLoader(true);
                    if (IS_PREVIEW) {
                        setTimeout(() => {
                            usersData = [...usersData, ...newUsers];
                            showLoader(false);
                            renderPage('manage-users');
                            notify(`Berhasil mengunggah ${newUsers.length} user (Preview)!`);
                        }, 1000);
                    } else {
                        callBackend('saveUsersBulkGAS', { newUsersArray: newUsers }).then(res => {
                            showLoader(false);
                            if(res.status === 'success') {
                                usersData = res.users;
                                renderPage('manage-users');
                                notify(`Berhasil menyimpan ${newUsers.length} user ke database!`);
                            } else {
                                notify('Gagal menyimpan ke database: ' + res.message, 'error');
                            }
                        });
                    }
                } else {
                    notify('Tidak ada data valid yang ditemukan di Excel.', 'warning');
                }
            };
            reader.readAsArrayBuffer(file);
            input.value = ''; 
        }

        function deleteUser(nip) {
            Swal.fire({
                title: 'Hapus User?',
                text: "Data user yang dihapus tidak bisa dikembalikan!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Ya, Hapus!',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    showLoader(true);
                    if (IS_PREVIEW) {
                        setTimeout(() => {
                            usersData = usersData.filter(u => u.nip !== nip);
                            showLoader(false);
                            notify('User berhasil dihapus');
                            renderPage('manage-users');
                        }, 1000);
                    } else {
                        callBackend('deleteUserGAS', { nip: nip }).then(res => {
                            showLoader(false);
                            if(res.status === 'success') {
                                usersData = res.users;
                                renderPage('manage-users');
                                notify('User berhasil dihapus');
                            } else {
                                notify(res.message, 'error');
                            }
                        });
                    }
                }
            });
        }

        function handleDeleteAllUsers() {
            Swal.fire({
                title: 'Hapus SEMUA User?',
                text: "Tindakan ini akan menghapus SEMUA user KECUALI akun Anda yang sedang login saat ini!",
                icon: 'error',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Ya, Hapus Semua!',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    showLoader(true);
                    if (IS_PREVIEW) {
                        setTimeout(() => {
                            usersData = usersData.filter(u => u.nip === currentUser.nip);
                            showLoader(false);
                            notify('Semua user lain berhasil dihapus');
                            renderPage('manage-users');
                        }, 1000);
                    } else {
                        callBackend('deleteAllUsersGAS', { currentAdminNip: currentUser.nip }).then(res => {
                            showLoader(false);
                            if(res.status === 'success') {
                                usersData = res.users;
                                renderPage('manage-users');
                                notify('Semua user lain berhasil dihapus');
                            } else {
                                notify(res.message, 'error');
                            }
                        });
                    }
                }
            });
        }

        if(!IS_PREVIEW) {
            document.addEventListener('DOMContentLoaded', () => {
                // Initial check logic
            });
        }
    </script>
</body>
</html>
